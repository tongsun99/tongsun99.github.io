<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <!-- 背景 -->
  <rect width="400" height="200" fill="#f0f4f8"/>

  <!-- 标题 -->
  <text x="200" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#1e40af">
    MkDocs 博客示例
  </text>

  <!-- 图标：文档 -->
  <g transform="translate(100, 80)">
    <rect x="0" y="0" width="60" height="75" fill="#3b82f6" rx="5"/>
    <rect x="10" y="15" width="40" height="4" fill="white" rx="2"/>
    <rect x="10" y="25" width="40" height="4" fill="white" rx="2"/>
    <rect x="10" y="35" width="30" height="4" fill="white" rx="2"/>
    <rect x="10" y="50" width="40" height="4" fill="white" rx="2"/>
    <rect x="10" y="60" width="35" height="4" fill="white" rx="2"/>
  </g>

  <!-- 箭头 -->
  <path d="M 170 120 L 230 120" stroke="#64748b" stroke-width="3" fill="none"/>
  <path d="M 220 115 L 230 120 L 220 125" fill="#64748b"/>

  <!-- 图标：网站 -->
  <g transform="translate(240, 80)">
    <rect x="0" y="0" width="60" height="75" fill="#10b981" rx="5"/>
    <rect x="5" y="5" width="50" height="30" fill="white" rx="2"/>
    <circle cx="12" cy="13" r="2" fill="#ef4444"/>
    <circle cx="20" cy="13" r="2" fill="#f59e0b"/>
    <circle cx="28" cy="13" r="2" fill="#10b981"/>
    <rect x="10" y="45" width="40" height="4" fill="white" rx="2"/>
    <rect x="10" y="55" width="30" height="4" fill="white" rx="2"/>
    <rect x="10" y="65" width="35" height="4" fill="white" rx="2"/>
  </g>

  <!-- 说明文字 -->
  <text x="200" y="180" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#475569">
    Markdown → 静态网站
  </text>
</svg>
